version: "3.9"

# Full local stack: observability backends + demo microservices + aggregator.
#
# Failure modes are toggled via environment variables — no rebuild needed.
# After changing a variable, restart just that service:
#   docker compose up -d --build service-b
#
# Ports in use:
#   8001  service-a (upstream API)
#   8002  service-b (flaky downstream)
#   8080  aggregator API
#   9090  Prometheus
#   3100  Loki
#   16686 Jaeger

services:

  # --------------------------------------------------------------------------
  # Demo microservices
  # --------------------------------------------------------------------------

  service-b:
    build:
      context: ./demo/service-b
    ports:
      - "8002:8002"
    environment:
      FAILURE_RATE: "0.5"
      LATENCY_MS: "0"
      OOM_ENDPOINT: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  service-a:
    build:
      context: ./demo/service-a
    ports:
      - "8001:8001"
    environment:
      SERVICE_B_URL: http://service-b:8002
      ENABLE_RETRY: "false"
      ENABLE_CIRCUIT_BREAKER: "false"
    depends_on:
      service-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Observability backends
  # --------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.6
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

  promtail:
    image: grafana/promtail:2.9.6
    volumes:
      - ./infra/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.56
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "6831:6831/udp"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Aggregator
  # --------------------------------------------------------------------------

  aggregator:
    build: .
    ports:
      - "8080:8080"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      JAEGER_URL: http://jaeger:16686
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
      LOG_LEVEL: info
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prometheus_data:
  loki_data:
