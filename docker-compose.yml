# Full local observability stack
#
# Services
#   service-b  (8002)  Flaky downstream — failure modes are toggled here
#   service-a  (8001)  Upstream API — calls service-b, has retry/circuit breaker
#   prometheus (9090)  Metrics backend
#   loki       (3100)  Log aggregation backend
#   jaeger     (16686) Distributed tracing backend
#   aggregator (8080)  Our API — queries all three backends and runs RCA
#   frontend   (8081)  Web UI — open this in your browser
#
# ── How to run a demo scenario ────────────────────────────────────────────────
#
#   Recommended: use the demo scripts in demo/. They handle traffic
#   generation and env var toggling for you:
#
#     bash demo/scenario_errors.sh   # Scenario A — 70% error rate
#     bash demo/scenario_slow.sh     # Scenario B — 2 s added latency
#     bash demo/scenario_crash.sh    # Scenario C — payment processor crash
#
#   Run each script from the project root directory.
#
#   Manual (no scripts needed):
#     1. Edit the environment variables under service-b or service-a below
#     2. Restart only that service (no rebuild needed):
#          docker compose up -d --no-deps service-b
#          docker compose up -d --no-deps service-a
#     3. Generate traffic to produce signals (logs, metrics, traces):
#          for i in $(seq 1 20); do curl -s http://localhost:8001/api/data; done
#     4. Open http://localhost:8081, query "service-a", click "Analyze with AI"
#
# ── Demo scenarios ────────────────────────────────────────────────────────────
#
#   Scenario A — Random 500 errors (tests basic RCA):
#     FAILURE_RATE: "0.7"   # 70% of /data requests will fail
#     then: for i in $(seq 1 30); do curl -s http://localhost:8001/api/data; done
#
#   Scenario B — Latency spike (tests slow-query detection):
#     LATENCY_MS: "2000"    # every /data call takes 2 extra seconds
#     then: for i in $(seq 1 10); do curl -s http://localhost:8001/api/data; done
#
#   Scenario C — Payment processor crash with stack trace:
#     No env var change needed — /crash is always available
#     then: for i in $(seq 1 10); do curl -s http://localhost:8002/crash; done
#
#   Scenario D — Memory leak (tests OOM alerting):
#     OOM_ENDPOINT: "true"  # exposes /oom endpoint
#     then: for i in $(seq 1 20); do curl -s http://localhost:8002/oom; done
#
#   Scenario E — Resilience comparison (shows retry/circuit breaker effect):
#     Set FAILURE_RATE: "0.7" on service-b, then compare:
#       - ENABLE_RETRY: "false", ENABLE_CIRCUIT_BREAKER: "false"  (errors cascade)
#       - ENABLE_RETRY: "true"                                    (some errors absorbed)
#       - ENABLE_CIRCUIT_BREAKER: "true"                         (circuit opens after 5 errors)

services:

  # ── service-b ──────────────────────────────────────────────────────────────
  # The flaky downstream service. All failure injection happens here.
  #
  # Endpoints (always available):
  #   GET /data   Main endpoint — subject to FAILURE_RATE and LATENCY_MS below
  #   GET /slow   Always takes 2.5s — simulates a DB table scan with no index
  #   GET /crash  Always raises an unhandled exception with a full stack trace
  #
  # Endpoints (only when OOM_ENDPOINT: "true"):
  #   GET /oom    Leaks 10 MB per call — triggers memory pressure alerts

  service-b:
    build:
      context: ./demo/service-b
    ports:
      - "8002:8002"
    environment:
      # Fraction of /data requests that return HTTP 500.
      # 0.0 = never fail, 0.5 = fail half the time, 1.0 = always fail
      FAILURE_RATE: "0.0"

      # Extra milliseconds added to every /data response.
      # Simulates a slow database query. 0 = no added delay.
      LATENCY_MS: "0"

      # Set to "true" to expose the /oom memory-leak endpoint.
      # Disabled by default so it cannot be triggered accidentally.
      OOM_ENDPOINT: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── service-a ──────────────────────────────────────────────────────────────
  # The upstream API. Calls service-b and optionally applies resilience patterns.
  # Toggling these shows how retry and circuit breaker change error propagation.
  #
  # Endpoints:
  #   GET /api/data   Proxies to service-b /data (with retry/CB if enabled)
  #   GET /api/slow   Proxies to service-b /slow — generates high-latency traces

  service-a:
    build:
      context: ./demo/service-a
    ports:
      - "8001:8001"
    environment:
      SERVICE_B_URL: http://service-b:8002

      # Retry failed requests to service-b up to 3 times with exponential backoff.
      # "false" = errors from service-b propagate immediately to the caller.
      # "true"  = up to 3 attempts before giving up (0.2s, 0.4s, 0.8s backoff).
      ENABLE_RETRY: "false"

      # Stop calling service-b after 5 consecutive errors (circuit opens).
      # Returns HTTP 503 immediately without touching service-b for 30 seconds,
      # then automatically retries (half-open). Good to demo alongside FAILURE_RATE.
      ENABLE_CIRCUIT_BREAKER: "false"
    depends_on:
      service-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Observability backends ─────────────────────────────────────────────────
  # These are third-party services — you should not need to edit them.
  # Config files live in infra/ if you need to adjust scrape targets or
  # retention settings.

  prometheus:
    image: prom/prometheus:v2.51.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - obs_aggregator_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:2.9.6
    ports:
      - "3100:3100"
    volumes:
      - ./infra/loki-config.yml:/etc/loki/local-config.yaml:ro
      - obs_aggregator_loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Promtail — log shipper. Watches all Docker container logs via the Docker
  # socket and forwards them to Loki with job/service labels so they can be
  # queried by service name. Without this, Loki receives nothing.
  promtail:
    image: grafana/promtail:2.9.6
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      loki:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.56
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "6831:6831/udp"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Aggregator ─────────────────────────────────────────────────────────────
  # Our API. Queries Prometheus, Loki, and Jaeger, correlates the signals,
  # and optionally runs AI root cause analysis via the Anthropic API.
  #
  # Required to set in a .env file (copy .env.example to get started):
  #
  #   ANTHROPIC_API_KEY  Without this, the "Analyze with AI" button in the
  #                      frontend will silently do nothing. The rest of the
  #                      query (metrics, logs, traces) still works fine.
  #
  # Optional:
  #   GITHUB_TOKEN       If set, RCA results include links to relevant code
  #   GITHUB_REPO        in the specified repo (e.g. "my-org/my-repo").
  #                      Safe to leave blank — RCA still works without it.

  aggregator:
    build: .
    ports:
      - "8080:8080"
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      JAEGER_URL: http://jaeger:16686
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GITHUB_REPO: "${GITHUB_REPO:-}"
      LOG_LEVEL: info
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend ───────────────────────────────────────────────────────────────
  # Served by nginx at http://localhost:8081
  # Source files are in frontend/ — nginx serves them directly so changes
  # to HTML/CSS/JS are visible immediately without restarting this service.

  frontend:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aggregator

volumes:
  obs_aggregator_prometheus_data:
  obs_aggregator_loki_data: