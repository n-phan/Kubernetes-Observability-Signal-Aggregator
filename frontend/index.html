<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K8s Observability Signal Aggregator</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <header>
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="16" cy="16" r="14" stroke="#3dffa0" stroke-width="1.5" stroke-dasharray="4 2" />
                    <circle cx="16" cy="16" r="7" stroke="#38d4f5" stroke-width="1" />
                    <circle cx="16" cy="16" r="2" fill="#3dffa0" />
                    <line x1="16" y1="2" x2="16" y2="8" stroke="#3dffa0" stroke-width="1.5" />
                    <line x1="16" y1="24" x2="16" y2="30" stroke="#3dffa0" stroke-width="1.5" />
                    <line x1="2" y1="16" x2="8" y2="16" stroke="#3dffa0" stroke-width="1.5" />
                    <line x1="24" y1="16" x2="30" y2="16" stroke="#3dffa0" stroke-width="1.5" />
                </svg>
            </div>
            <div>
                <div class="logo-text">OBS // AGGREGATOR</div>
                <div class="logo-sub">K8s Signal Intelligence</div>
            </div>
        </div>

        <div class="query-bar">
            <div class="field">
                <label>Target</label>
                <input id="inp-target" type="text" value="service-a" placeholder="service-a" />
            </div>
            <div class="field">
                <label>Namespace</label>
                <input id="inp-namespace" type="text" value="default" placeholder="default" />
            </div>
            <div class="field" id="field-lookback">
                <label>Lookback (min)</label>
                <input id="inp-lookback" type="number" value="30" min="1" max="1440" />
            </div>
            <div class="field">
                <label>API Endpoint</label>
                <input id="inp-endpoint" type="text" value="http://localhost:8080" />
            </div>
            <button class="btn-query" id="btn-query" onclick="runQuery()">▶ Query</button>
            <button class="btn-mock" id="btn-mock" onclick="runMock()">⊡ Mock</button>
            <div class="status-dot" id="status-dot"></div>
        </div>
    </header>

    <main id="main">
        <div class="empty-state">
            <span class="glyph">◎</span>
            <p>Enter a target service and press Query to begin signal aggregation.</p>
        </div>
    </main>

    <!--
  Script load order matters — each file depends on the ones above it:
    config.js  → constants (PAGE_SIZE) and MOCK_DATA
    utils.js   → shared helpers ($, fmt, escHtml, collapsible, …)
    render.js  → panel builders (uses utils + filter state from filters.js)
    filters.js → filter/pagination state and functions (uses utils + render)
    api.js     → fetch calls and result orchestration (uses all of the above)
-->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/render.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/api.js"></script>

</body>

</html>
