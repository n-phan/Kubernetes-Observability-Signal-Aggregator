<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K8s Observability Signal Aggregator</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap"
        rel="stylesheet" />

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

    <aside id="sidebar"></aside>

    <header>
        <!-- Target is picked from the sidebar → Service list (inp-target below is
             a hidden holder for the current selection). API Endpoint / Namespace
             live in the sidebar Setting item. -->
        <select id="inp-target" hidden></select>

        <div class="query-bar">
            <div class="field">
                <label>Target</label>
                <span id="target-label" class="target-label">— pick in sidebar ▸ Service</span>
            </div>
            <div class="field" id="field-lookback">
                <label>Lookback (min)</label>
                <input id="inp-lookback" type="number" value="30" min="1" max="1440" />
            </div>
            <button class="btn-query" id="btn-query" onclick="runQuery()">▶ Query</button>
            <button class="btn-mock"  id="btn-mock"  onclick="runMock()" style="display:none">⊡ Mock</button>
            <button class="btn-mock"  id="btn-demo"  onclick="DemoPanel.toggle()">⚙ Demo</button>
            <div class="status-dot" id="status-dot"></div>
            <a class="gh-link" href="https://github.com/n-phan/Kubernetes-Observability-Signal-Aggregator"
               target="_blank" rel="noopener noreferrer" title="View source on GitHub">
                <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true">
                    <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
            </a>
            <button class="btn-theme" id="btn-theme" onclick="toggleTheme()" title="Toggle light/dark mode" aria-label="Toggle light/dark mode">
                <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="16" height="16"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                </svg>
                <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="16" height="16"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
        </div>
    </header>

    <section id="cluster-bar"></section>

    <main id="main">
        <div class="empty-state">
            <span class="glyph">◎</span>
            <p>Enter a target service and press Query to begin signal aggregation.</p>
        </div>
    </main>

    <!--
  Script load order matters — each file depends on the ones above it:

    config.js                → constants (PAGE_SIZE) and MOCK_DATA
    utils.js                 → shared helpers ($, fmt, escHtml, collapsible, …)

    components/MetaBar.js        → summary row at the top of each result
    components/RcaPanel.js       → AI root cause analysis (or placeholder)
    components/CorrelationsPanel.js → cross-signal correlation events
    components/MetricsPanel.js   → Prometheus metric series table
    components/LogsPanel.js      → paginated, filterable Loki log lines
    components/TracesPanel.js    → paginated, filterable Jaeger traces
    components/ClusterStatusPanel.js → homepage CPU/memory/disk gauges
    components/Sidebar.js        → left navigation rail (Service / History / Setting)
    components/LlmConfigPanel.js → Settings → Config LLM form
    components/ConnectionPanel.js → Settings → API Endpoint & Namespace form
    components/HistoryPanel.js   → recurrence banner + browsable query history

    evidence.js              → makes RCA "supporting evidence" items jump to the
                               matching Metrics / Logs / Traces row
    api.js                   → fetch calls, instantiates the components above
-->
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>

    <script src="js/components/MetaBar.js"></script>
    <script src="js/components/RcaPanel.js"></script>
    <script src="js/components/CorrelationsPanel.js"></script>
    <script src="js/components/TimelinePanel.js"></script>
    <script src="js/components/MetricsPanel.js"></script>
    <script src="js/components/LogsPanel.js"></script>
    <script src="js/components/TracesPanel.js"></script>
    <script src="js/components/DemoPanel.js"></script>
    <script src="js/components/ServicePanel.js"></script>
    <script src="js/components/ClusterStatusPanel.js"></script>
    <script src="js/components/LlmConfigPanel.js"></script>
    <script src="js/components/ConnectionPanel.js"></script>
    <script src="js/components/EnvironmentPanel.js"></script>
    <script src="js/components/WatchdogPanel.js"></script>
    <script src="js/components/HistoryPanel.js"></script>
    <script src="js/components/Sidebar.js"></script>

    <script src="js/evidence.js"></script>
    <script src="js/api.js"></script>

    <script>
      // Initialise panels after all components and api.js are loaded.
      // ConnectionPanel.init() goes first — it creates #inp-endpoint / #inp-namespace,
      // which the other panels read on startup.
      ConnectionPanel.init();
      EnvironmentPanel.init();
      WatchdogPanel.init();
      Sidebar.init();
      DemoPanel.init();
      ServicePanel.init();
      ClusterStatusPanel.init();

      // Populate the target <select> from the aggregator's /services on load,
      // and again whenever the endpoint changes or a service is registered.
      async function loadServices() {
        const endpoint = $('inp-endpoint').value.trim().replace(/\/$/, '');
        const sel = $('inp-target');
        try {
          const resp = await fetch(`${endpoint}/services`);
          if (!resp.ok) return;
          const services = await resp.json();
          const current = sel.value;
          sel.innerHTML = '<option value="" disabled>Select a service…</option>'
            + services.map(s => `<option value="${escHtml(s)}"${s === current ? ' selected' : ''}>${escHtml(s)}</option>`).join('');
          if (!sel.value) sel.value = '';
        } catch (_) {}
      }
      loadServices();

      // ── Light / dark mode toggle ──────────────────────────────────────────
      // The sun/moon icons swap purely via CSS (`body.light .theme-icon-*`),
      // so this just flips the class and persists the choice.
      function toggleTheme() {
        const isLight = document.body.classList.toggle('light');
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
      }

      // Restore saved preference on load
      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light');
      }
    </script>

</body>

</html>
