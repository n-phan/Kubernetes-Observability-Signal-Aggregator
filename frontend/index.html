<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K8s Observability Signal Aggregator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:         #070b12;
      --bg-panel:   #0d1421;
      --bg-raised:  #121c2e;
      --border:     #1e2d45;
      --border-lit: #2a4060;
      --text:       #c8d8eb;
      --text-dim:   #5a7a9a;
      --text-muted: #3a5070;
      --accent:     #3dffa0;
      --accent-dim: #1a6644;
      --cyan:       #38d4f5;
      --error:      #ff4e6a;
      --error-dim:  #5a1020;
      --warn:       #ffb347;
      --warn-dim:   #5a3a10;
      --info:       #38d4f5;
      --info-dim:   #103040;
      --p1:         #ff4e6a;
      --p2:         #ffb347;
      --p3:         #3dffa0;
      --mono:       'IBM Plex Mono', monospace;
      --sans:       'IBM Plex Sans', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.7;
      min-height: 100vh;
    }

    /* ── Scanline overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 16px;
      background: var(--bg-panel);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      position: relative;
    }

    .logo-icon svg { width: 32px; height: 32px; }

    .logo-text {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .logo-sub {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
    }


    .btn-mock {
      align-self: flex-end;
      background: transparent;
      border: 1px solid var(--border-lit);
      border-radius: 4px;
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      padding: 8px 14px;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-mock:hover { border-color: var(--warn); color: var(--warn); }
    .btn-mock.active { border-color: var(--warn); color: var(--warn); background: var(--warn-dim); }
    .btn-analyze {
      align-self: center;
      background: transparent;
      border: 1px solid var(--accent-dim);
      border-radius: 4px;
      color: var(--accent);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      padding: 8px 16px;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-analyze:hover { background: var(--accent-dim); border-color: var(--accent); }
    .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; }

    .rca-placeholder {
      padding: 20px;
      text-align: center;
      color: var(--text-dim);
      font-size: 13px;
      font-family: var(--sans);
    }



    /* ── Query bar ── */
    .query-bar {
      display: flex;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .field label {
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .field input, .field select {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color 0.2s;
    }

    .field input:focus, .field select:focus {
      border-color: var(--accent);
    }

    .field input { width: clamp(100px, 18vw, 180px); }
    .field select { width: clamp(80px, 10vw, 100px); }

    #field-lookback input { width: clamp(60px, 8vw, 80px); }

    .btn-query {
      align-self: flex-end;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #070b12;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 8px 20px;
      text-transform: uppercase;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-query:hover { opacity: 0.85; }
    .btn-query:active { transform: scale(0.97); }
    .btn-query:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      align-self: flex-end;
      margin-bottom: 10px;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .status-dot.loading { background: var(--warn); animation: pulse 1s infinite; }
    .status-dot.ok      { background: var(--accent); }
    .status-dot.mock    { background: var(--warn); }
    .status-dot.error   { background: var(--error); }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

    @media (max-width: 700px) {
      header { padding: 12px 16px; gap: 12px; }
      .logo-sub { display: none; }
      .field input { width: 100% !important; }
      .field select { width: 100% !important; }
      .query-bar { width: 100%; }
      .btn-mock { align-self: center; }
    }

    /* ── Main layout ── */
    main {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Empty / error state ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text-muted);
    }

    .empty-state .glyph {
      font-size: 48px;
      display: block;
      margin-bottom: 16px;
      opacity: 0.4;
    }

    .empty-state p { font-size: 13px; letter-spacing: 0.05em; }

    /* ── Meta bar ── */
    .meta-bar {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 16px;
      padding: 12px 16px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .meta-bar .target {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .meta-bar .sep { color: var(--text-muted); }

    .meta-bar .window { font-family: var(--mono); color: var(--text); }

    .meta-bar .duration {
      color: var(--text-muted);
      font-size: 10px;
    }

    .meta-bar .summary-pill {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 10px;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    /* ── Section panel ── */
    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .panel-header:hover { background: var(--bg-raised); }

    .panel-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .panel-count {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: auto;
    }

    .panel-chevron {
      font-size: 10px;
      color: var(--text-muted);
      transition: transform 0.2s;
    }

    .panel.collapsed .panel-chevron { transform: rotate(-90deg); }
    .panel.collapsed .panel-body { display: none; }

    .panel-body { padding: 16px; }

    /* ── RCA panel ── */
    .rca-summary {
      font-size: 17px;
      font-family: var(--sans);
      font-weight: 600;
      color: #fff;
      line-height: 1.5;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .rca-root-cause {
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 20px;
    }

    .confidence-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .confidence-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .confidence-bar {
      flex: 1;
      height: 4px;
      background: var(--bg-raised);
      border-radius: 2px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      border-radius: 2px;
      transition: width 0.6s ease;
    }

    .confidence-pct {
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      width: 36px;
      text-align: right;
    }

    .rca-subsection {
      margin-bottom: 20px;
    }

    .rca-subsection-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }

    .evidence-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .evidence-list li {
      display: flex;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      font-family: var(--sans);
      line-height: 1.6;
    }

    .evidence-list li::before {
      content: '·';
      color: var(--accent-dim);
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ── Actions table ── */
    .actions-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .action-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 10px 12px;
      background: var(--bg-raised);
      border-radius: 4px;
      border-left: 3px solid transparent;
    }

    .action-row.p1 { border-color: var(--p1); }
    .action-row.p2 { border-color: var(--p2); }
    .action-row.p3 { border-color: var(--p3); }

    .action-priority {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      flex-shrink: 0;
      padding-top: 3px;
    }

    .p1 .action-priority { color: var(--p1); }
    .p2 .action-priority { color: var(--p2); }
    .p3 .action-priority { color: var(--p3); }

    .action-content { flex: 1; }

    .action-text {
      font-size: 14px;
      font-family: var(--sans);
      font-weight: 500;
      color: var(--text);
      margin-bottom: 4px;
    }

    .action-rationale {
      font-size: 13px;
      font-family: var(--sans);
      color: var(--text-dim);
    }

    /* ── Code references ── */
    .code-refs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .code-ref {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-raised);
      border-radius: 4px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }

    .code-ref:hover { border-color: var(--border-lit); }

    .code-ref-icon { color: var(--accent-dim); font-size: 14px; flex-shrink: 0; }

    .code-ref-info { flex: 1; min-width: 0; }

    .code-ref-path {
      font-size: 13px;
      font-weight: 500;
      color: var(--cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .code-ref-relevance {
      font-size: 12px;
      color: var(--text-dim);
      font-family: var(--sans);
    }

    .code-ref-link {
      font-size: 10px;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.05em;
      flex-shrink: 0;
      padding: 3px 8px;
      border: 1px solid var(--accent-dim);
      border-radius: 3px;
      transition: background 0.15s;
    }

    .code-ref-link:hover { background: var(--accent-dim); }

    /* ── Correlations ── */
    .corr-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .corr-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: var(--bg-raised);
      border-radius: 4px;
    }

    .severity-badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .severity-badge.error   { background: var(--error-dim); color: var(--error); }
    .severity-badge.warn    { background: var(--warn-dim);  color: var(--warn);  }
    .severity-badge.info    { background: var(--info-dim);  color: var(--info);  }
    .severity-badge.unknown { background: var(--bg);        color: var(--text-dim); border: 1px solid var(--border); }

    .corr-kind {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .corr-desc {
      flex: 1;
      font-size: 14px;
      font-family: var(--sans);
      color: var(--text);
    }

    .corr-conf {
      font-size: 11px;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* ── Data table ── */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: left;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    .data-table td {
      padding: 7px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }

    .data-table tr:last-child td { border-bottom: none; }

    .data-table tr:hover td { background: var(--bg-raised); }

    .data-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--cyan);
    }

    .data-table td.labels {
      color: var(--text-dim);
      font-size: 11px;
      word-break: break-all;
    }

    /* ── Logs ── */

    .log-filters {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .log-filter-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }


    .pagination {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      justify-content: center;
    }

    .page-btn {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 11px;
      padding: 4px 12px;
      transition: border-color 0.15s, color 0.15s;
    }

    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .page-info {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }


    .log-msg-preview {
      flex: 1;
      font-size: 11px;
      color: var(--text-dim);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .log-msg-preview.error-msg { color: var(--text); }

    .log-msg-full {
      flex: 1;
      font-size: 11px;
      color: var(--text-dim);
      word-break: break-word;
      white-space: pre-wrap;
      font-family: var(--mono);
      cursor: pointer;
    }

    .log-msg-full.error-msg { color: var(--text); }

    .log-expand-btn {
      font-size: 10px;
      color: var(--text-muted);
      cursor: pointer;
      flex-shrink: 0;
      padding: 0 6px;
      user-select: none;
      transition: color 0.15s;
    }

    .log-expand-btn:hover { color: var(--accent); }

    .log-container {
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    .log-line-num {
      color: var(--text-muted);
      font-size: 10px;
      flex-shrink: 0;
      width: 36px;
      text-align: right;
      padding-right: 8px;
      user-select: none;
    }

    .log-row {
      display: flex;
      gap: 12px;
      padding: 4px 12px;
      border-bottom: 1px solid rgba(30,45,69,0.5);
      align-items: flex-start;
    }

    .log-row:hover { background: var(--bg-raised); }

    .log-ts {
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
      padding-top: 1px;
      width: 95px;
      white-space: nowrap;
    }

    .log-level {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      flex-shrink: 0;
      padding-top: 2px;
      width: 72px;
    }

    .log-level.error, .log-level.critical { color: var(--error); }
    .log-level.warn, .log-level.warning   { color: var(--warn); }
    .log-level.info                        { color: var(--info); }
    .log-level.unknown                     { color: var(--text-muted); }

    .log-msg {
      flex: 1;
      font-size: 11px;
      color: var(--text-dim);
      word-break: break-word;
      white-space: pre-wrap;
      font-family: var(--mono);
    }

    .log-msg.error-msg { color: var(--text); }

    /* ── Traces ── */

    .trace-filters {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .filter-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 3px 10px;
      border-radius: 3px;
      border: 1px solid var(--border);
      background: transparent;
      font-family: var(--mono);
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }

    .filter-toggle:hover { border-color: var(--border-lit); color: var(--text); }
    .filter-toggle.active { border-color: var(--error); color: var(--error); background: var(--error-dim); }

    .filter-input {
      background: var(--bg-raised);
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      padding: 3px 8px;
      outline: none;
      width: 90px;
      transition: border-color 0.2s;
    }

    .filter-input:focus { border-color: var(--accent); }

    .filter-count {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    .trace-block {
      margin-bottom: 12px;
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
    }

    .trace-block:last-child { margin-bottom: 0; }
    .trace-block .trace-spans { overflow: hidden; }
    .trace-block.collapsed .trace-spans { display: none; }
    .trace-header { cursor: pointer; }
    .trace-chevron { margin-left: auto; color: var(--text-muted); font-size: 10px; transition: transform 0.2s; }
    .trace-block.collapsed .trace-chevron { transform: rotate(-90deg); }

    .trace-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      background: var(--bg-raised);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .trace-id { color: var(--text-muted); font-size: 10px; }
    .trace-svc { color: var(--accent); font-weight: 500; }
    .trace-dur { color: var(--text-dim); margin-left: auto; }

    .span-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      border-bottom: 1px solid rgba(30,45,69,0.4);
      font-size: 11px;
    }

    .span-row:last-child { border-bottom: none; }
    .span-row:hover { background: var(--bg-raised); }

    .span-error-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--error);
      flex-shrink: 0;
    }

    .span-ok-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-dim);
      flex-shrink: 0;
    }

    .span-svc { color: var(--text-dim); width: 100px; flex-shrink: 0; }
    .span-op  { flex: 1; color: var(--text); }
    .span-dur { color: var(--cyan); width: 70px; text-align: right; flex-shrink: 0; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-lit); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ── Error message ── */
    .error-msg-box {
      padding: 16px;
      background: var(--error-dim);
      border: 1px solid var(--error);
      border-radius: 4px;
      color: var(--error);
      font-size: 12px;
    }

    /* ── Animations ── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .animate-in { animation: fadeIn 0.3s ease forwards; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="14" stroke="#3dffa0" stroke-width="1.5" stroke-dasharray="4 2"/>
        <circle cx="16" cy="16" r="7"  stroke="#38d4f5" stroke-width="1"/>
        <circle cx="16" cy="16" r="2"  fill="#3dffa0"/>
        <line x1="16" y1="2"  x2="16" y2="8"  stroke="#3dffa0" stroke-width="1.5"/>
        <line x1="16" y1="24" x2="16" y2="30" stroke="#3dffa0" stroke-width="1.5"/>
        <line x1="2"  y1="16" x2="8"  y2="16" stroke="#3dffa0" stroke-width="1.5"/>
        <line x1="24" y1="16" x2="30" y2="16" stroke="#3dffa0" stroke-width="1.5"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">OBS // AGGREGATOR</div>
      <div class="logo-sub">K8s Signal Intelligence</div>
    </div>
  </div>

  <div class="query-bar">
    <div class="field">
      <label>Target</label>
      <input id="inp-target" type="text" value="service-a" placeholder="service-a" />
    </div>
    <div class="field">
      <label>Namespace</label>
      <input id="inp-namespace" type="text" value="default" placeholder="default" />
    </div>
    <div class="field" id="field-lookback">
      <label>Lookback (min)</label>
      <input id="inp-lookback" type="number" value="30" min="1" max="1440" />
    </div>
    <div class="field">
      <label>API Endpoint</label>
      <input id="inp-endpoint" type="text" value="http://localhost:8080" />
    </div>
    <button class="btn-query" id="btn-query" onclick="runQuery()">▶ Query</button>
    <button class="btn-mock" id="btn-mock" onclick="runMock()">⊡ Mock</button>
    <div class="status-dot" id="status-dot"></div>
  </div>
</header>

<main id="main">
  <div class="empty-state">
    <span class="glyph">◎</span>
    <p>Enter a target service and press Query to begin signal aggregation.</p>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);

  function setStatus(state) {
    const dot = $('status-dot');
    dot.className = 'status-dot ' + state;
  }

  function fmt(v) {
    if (v === null || v === undefined) return '—';
    if (typeof v === 'number') {
      if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(2) + 'M';
      if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(2) + 'K';
      if (Number.isNaN(v)) return 'nan';
      return v.toPrecision(4);
    }
    return String(v);
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toISOString().slice(11, 19) + ' UTC'; }
    catch { return iso; }
  }

  function severityClass(sev) {
    if (!sev) return 'unknown';
    const s = sev.toLowerCase();
    if (s === 'error' || s === 'critical') return 'error';
    if (s === 'warn' || s === 'warning') return 'warn';
    if (s === 'info') return 'info';
    return 'unknown';
  }

  function confidenceColor(c) {
    if (c >= 0.8) return '#3dffa0';
    if (c >= 0.5) return '#ffb347';
    return '#ff4e6a';
  }

  function collapsible(header, body) {
    const panel = document.createElement('div');
    panel.className = 'panel animate-in';
    panel.innerHTML = `<div class="panel-header">${header}</div><div class="panel-body">${body}</div>`;
    panel.querySelector('.panel-header').addEventListener('click', () => {
      panel.classList.toggle('collapsed');
    });
    return panel;
  }

  function renderMeta(data) {
    const m = data.meta || {};
    const cols = data.correlations || [];
    const logCount = data.logs?.total_lines ?? 0;
    const traceCount = data.traces?.traces?.length ?? 0;
    const metricCount = data.metrics?.series?.length ?? 0;
    const rca = data.rca || {};

    const el = document.createElement('div');
    el.className = 'meta-bar animate-in';
    el.innerHTML = `
      <span class="target">${m.target || '—'}</span>
      <span class="sep">·</span>
      <span>${m.namespace || 'default'}</span>
      <span class="sep">·</span>
      <span class="window">${fmtTime(m.window_start)} → ${fmtTime(m.window_end)}</span>
      <span class="summary-pill">${metricCount} series</span>
      <span class="summary-pill">${logCount} log lines</span>
      <span class="summary-pill">${traceCount} trace(s)</span>
      <span class="summary-pill">${cols.length} correlation(s)</span>
      ${rca.performed ? `<span class="summary-pill" style="color:var(--accent);border-color:var(--accent-dim)">RCA ✓</span>` : ''}
      <span class="duration">${(m.query_duration_ms ?? 0).toFixed(0)} ms</span>
    `;
    return el;
  }

  function renderRCA(rca) {
    if (!rca || !rca.performed) return null;

    const conf = rca.confidence || 0;
    const pct = Math.round(conf * 100);
    const color = confidenceColor(conf);

    const actions = (rca.recommended_actions || []).map(a => `
      <div class="action-row p${a.priority}">
        <span class="action-priority">P${a.priority}</span>
        <div class="action-content">
          <div class="action-text">${a.action}</div>
          <div class="action-rationale">${a.rationale}</div>
        </div>
      </div>
    `).join('');

    const evidence = (rca.supporting_evidence || []).map(e => `<li>${e}</li>`).join('');

    const codeRefs = (rca.code_references || []).map(r => `
      <div class="code-ref">
        <span class="code-ref-icon">⌥</span>
        <div class="code-ref-info">
          <div class="code-ref-path">${r.path}${r.line_number ? '#L' + r.line_number : ''}</div>
          <div class="code-ref-relevance">${r.relevance || ''}</div>
        </div>
        ${r.url ? `<a class="code-ref-link" href="${r.url}" target="_blank" rel="noopener">↗ GitHub</a>` : ''}
      </div>
    `).join('');

    const body = `
      <div class="rca-summary">${rca.summary}</div>
      <div class="rca-root-cause">${rca.root_cause}</div>
      <div class="confidence-row">
        <span class="confidence-label">Confidence</span>
        <div class="confidence-bar">
          <div class="confidence-fill" style="width:${pct}%;background:${color}"></div>
        </div>
        <span class="confidence-pct" style="color:${color}">${pct}%</span>
      </div>
      ${evidence ? `<div class="rca-subsection">
        <div class="rca-subsection-title">Supporting evidence</div>
        <ul class="evidence-list">${evidence}</ul>
      </div>` : ''}
      ${actions ? `<div class="rca-subsection">
        <div class="rca-subsection-title">Recommended actions</div>
        <div class="actions-list">${actions}</div>
      </div>` : ''}
      ${codeRefs ? `<div class="rca-subsection">
        <div class="rca-subsection-title">Code references</div>
        <div class="code-refs">${codeRefs}</div>
      </div>` : ''}
    `;

    const header = `
      <span class="panel-title" style="color:var(--accent)">Root Cause Analysis</span>
      <span style="font-size:10px;color:var(--text-dim);margin-left:8px">${pct}% confidence</span>
      <span class="panel-count">▾</span>
    `;

    return collapsible(header, body);
  }

  function renderCorrelations(cols) {
    if (!cols || cols.length === 0) return null;
    const rows = cols.map(c => {
      const sc = severityClass(c.severity);
      return `
        <div class="corr-row">
          <span class="severity-badge ${sc}">${c.severity || 'unknown'}</span>
          <span class="corr-kind">${c.kind || ''}</span>
          <span class="corr-desc">${c.description || ''}</span>
          <span class="corr-conf">${Math.round((c.confidence || 0) * 100)}%</span>
        </div>
      `;
    }).join('');

    const header = `<span class="panel-title">Correlations</span><span class="panel-count">${cols.length} event(s) ▾</span>`;
    return collapsible(header, `<div class="corr-list">${rows}</div>`);
  }

  function renderMetrics(metrics) {
    const series = metrics?.series || [];
    if (!series.length) return null;

    const rows = series.map(s => {
      const labels = Object.entries(s.labels || {})
        .map(([k,v]) => `${k}=<span style="color:var(--cyan)">${v}</span>`).join(', ');
      return `
        <tr>
          <td>${s.name || '—'}</td>
          <td class="num">${fmt(s.latest_value)}</td>
          <td class="num">${fmt(s.peak_value)}</td>
          <td class="labels">${labels || '—'}</td>
        </tr>
      `;
    }).join('');

    const body = `
      <table class="data-table">
        <thead><tr>
          <th>Metric</th><th>Latest</th><th>Peak</th><th>Labels</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;

    const header = `<span class="panel-title">Metrics</span><span class="panel-count">${series.length} series ▾</span>`;
    return collapsible(header, body);
  }

  // Log filter state
  let _logFilters = { errorsOnly: false, search: '' };

  function applyLogFilters() {
    _logPage = 0;
    renderLogPage();
  }

  function toggleLogErrorFilter() {
    _logFilters.errorsOnly = !_logFilters.errorsOnly;
    applyLogFilters();
  }

  function updateLogSearch(val) {
    _logFilters.search = val.trim().toLowerCase();
    applyLogFilters();
  }

  // Log pagination state
  const LOG_PAGE_SIZE = 10;
  const TRACE_PAGE_SIZE = 10;
  let _logPage = 0;
  let _allLogLines = [];

  function renderLogPage() {
    const { errorsOnly, search } = _logFilters;
    const filtered = _allLogLines.filter(l => {
      const lvl = (l.severity || 'unknown').toLowerCase();
      const sc = severityClass(lvl);
      const isErr = sc === 'error';
      const msg = (fmtTime(l.timestamp) + ' ' + (l.message || '')).toLowerCase();
      return (!errorsOnly || isErr) && (!search || msg.includes(search));
    });

    const totalPages = Math.max(1, Math.ceil(filtered.length / LOG_PAGE_SIZE));
    _logPage = Math.min(_logPage, totalPages - 1);
    const pageStart = _logPage * LOG_PAGE_SIZE;
    // Attach global index (position in _allLogLines) to each filtered line
    const filteredWithIdx = filtered.map(l => ({ ...l, _globalIdx: _allLogLines.indexOf(l) + 1 }));
    const pageLines = filteredWithIdx.slice(pageStart, pageStart + LOG_PAGE_SIZE);

    const rows = pageLines.map((l, idx) => {
      const globalIdx = l._globalIdx; // 1-based position in the full unfiltered log
      const lvl = (l.severity || 'unknown').toLowerCase();
      const sc = severityClass(lvl);
      const isErr = sc === 'error';
      const fullMsg = l.message || '';
      const firstLine = fullMsg.split('\n')[0];
      const multiline = fullMsg.indexOf('\n') !== -1;
      const id = _logPage + '-' + idx;
      const expandBtn = multiline
        ? `<span class="log-expand-btn" id="log-btn-${id}" onclick="toggleLogEntry('${id}')">▸</span>`
        : `<span style="width:18px;flex-shrink:0"></span>`;
      return `
        <div class="log-row" data-is-error="${isErr}" data-msg="${escHtml((fmtTime(l.timestamp)+' '+fullMsg).toLowerCase().slice(0,300))}">
          <span class="log-line-num">#${globalIdx}</span>
          <span class="log-ts">${fmtTime(l.timestamp)}</span>
          <span class="log-level ${lvl}">${(l.severity || 'unknown').toUpperCase()}</span>
          ${expandBtn}
          <span class="log-msg-preview ${isErr ? 'error-msg' : ''}" id="log-preview-${id}"
                style="cursor:${multiline?'pointer':'default'}"
                onclick="${multiline ? `toggleLogEntry('` + id + `')` : ''}">${escHtml(firstLine)}</span>
          <span class="log-msg-full ${isErr ? 'error-msg' : ''}" id="log-full-${id}"
                style="display:none;cursor:pointer"
                onclick="toggleLogEntry('${id}')">${escHtml(fullMsg)}</span>
        </div>
      `;
    }).join('') || '<div class="log-row"><span class="log-msg-preview" style="color:var(--text-muted)">No log lines match the current filters.</span></div>';

    const container = document.getElementById('log-rows-container');
    if (container) container.innerHTML = rows;

    const countEl = document.getElementById('log-header-count');
    if (countEl) countEl.textContent = `${filtered.length} of ${_allLogLines.length} ▾`;

    const pageInput = document.getElementById('log-page-input');
    if (pageInput) pageInput.value = _logPage + 1;
    const pageTotal = document.getElementById('log-page-total');
    if (pageTotal) pageTotal.textContent = `of ${totalPages}`;

    const prevBtn = document.getElementById('log-prev-btn');
    const nextBtn = document.getElementById('log-next-btn');
    if (prevBtn) prevBtn.disabled = _logPage === 0;
    if (nextBtn) nextBtn.disabled = _logPage >= totalPages - 1;

    const errBtn = document.getElementById('log-errors-btn');
    if (errBtn) errBtn.classList.toggle('active', errorsOnly);
  }

  function renderLogs(logs) {
    const lines = logs?.lines || [];
    const total = logs?.total_lines ?? 0;
    if (!lines.length) return null;

    _allLogLines = lines;
    _logPage = 0;
    _logFilters = { errorsOnly: false, search: '' };

    const filterBar = `
      <div class="log-filters">
        <span class="filter-label">Filter</span>
        <button class="filter-toggle" id="log-errors-btn" onclick="toggleLogErrorFilter()">
          ● Errors only
        </button>
        <span class="filter-label" style="margin-left:4px">Search</span>
        <input class="filter-input" placeholder="keyword…" style="width:140px" oninput="updateLogSearch(this.value)" />
      </div>
    `;
    const logBody = `<div class="log-container"><div id="log-rows-container"></div></div>`;
    const pager = `
      <div class="pagination">
        <button class="page-btn" id="log-prev-btn" onclick="logPagePrev()">◀ Prev</button>
        <span class="page-info">Page</span>
        <input class="filter-input" id="log-page-input" type="number" min="1" value="1"
          style="width:46px;text-align:center;padding:3px 6px"
          onchange="logJumpToPage(this.value)"
          onkeydown="if(event.key==='Enter') logJumpToPage(this.value)" />
        <span class="page-info" id="log-page-total">of 1</span>
        <button class="page-btn" id="log-next-btn" onclick="logPageNext()">Next ▶</button>
        <span style="width:1px;height:16px;background:var(--border);margin:0 8px;flex-shrink:0"></span>
        <span class="page-info">Line #</span>
        <input class="filter-input" id="log-line-input" type="number" min="1" placeholder="go to line…"
          style="width:110px;text-align:center;padding:3px 6px"
          onkeydown="if(event.key==='Enter') logJumpToLine(this.value)"
          onchange="logJumpToLine(this.value)" />
      </div>
    `;
    const body = filterBar + logBody + pager;
    const header = `<span class="panel-title">Logs</span><span class="panel-count" id="log-header-count">${lines.length} of ${total} ▾</span>`;
    const panel = collapsible(header, body);
    // Render first page after DOM is ready
    setTimeout(() => renderLogPage(), 0);
    return panel;
  }

  function toggleLogEntry(id) {
    const preview = document.getElementById('log-preview-' + id);
    const full    = document.getElementById('log-full-' + id);
    const btn     = document.getElementById('log-btn-' + id);
    if (!preview || !full) return;
    const isExpanded = full.style.display !== 'none';
    preview.style.display = isExpanded ? '' : 'none';
    full.style.display    = isExpanded ? 'none' : '';
    if (btn) btn.textContent = isExpanded ? '▸' : '▾';
  }

  function logPagePrev() { _logPage = Math.max(0, _logPage - 1); renderLogPage(); }
  function logPageNext() { _logPage++; renderLogPage(); }
  function logJumpToPage(val) { const p = parseInt(val) - 1; if (!isNaN(p)) { _logPage = Math.max(0, p); renderLogPage(); } }
  function logJumpToLine(val) {
    const lineNum = parseInt(val);
    if (isNaN(lineNum) || lineNum < 1) return;
    // Find position of this global line number in the current filtered list
    const { errorsOnly, search } = _logFilters;
    const filtered = _allLogLines.filter(l => {
      const lvl = (l.severity || 'unknown').toLowerCase();
      const isErr = severityClass(lvl) === 'error';
      const msg = (fmtTime(l.timestamp) + ' ' + (l.message || '')).toLowerCase();
      return (!errorsOnly || isErr) && (!search || msg.includes(search));
    });
    // Find index of the entry whose global index matches
    const pos = filtered.findIndex(l => _allLogLines.indexOf(l) + 1 === lineNum);
    if (pos === -1) {
      // Line not in current filter — clear filters and jump
      _logFilters = { errorsOnly: false, search: '' };
      const errBtn = document.getElementById('log-errors-btn');
      if (errBtn) errBtn.classList.remove('active');
      const searchInput = document.querySelector('.log-filters .filter-input');
      if (searchInput) searchInput.value = '';
      _logPage = Math.floor((lineNum - 1) / LOG_PAGE_SIZE);
    } else {
      _logPage = Math.floor(pos / LOG_PAGE_SIZE);
    }
    renderLogPage();
    // Clear the input after jump
    const inp = document.getElementById('log-line-input');
    if (inp) inp.value = '';
  }

  // Trace state
  let _traceFilters = { errorsOnly: false, minDuration: 0 };
  let _tracePage = 0;
  let _allTraceData = [];

  function buildTraceBlock(t) {
    function sortSpans(spans) {
      const parentOf = s => s.references && s.references.length > 0 ? s.references[0].span_id : null;
      const children = {};
      spans.forEach(s => {
        const p = parentOf(s);
        if (p) { children[p] = children[p] || []; children[p].push(s); }
      });
      const result = [];
      function walk(s, depth) {
        result.push({ ...s, _depth: depth });
        (children[s.span_id] || [])
          .sort((a,b) => new Date(a.start_time) - new Date(b.start_time))
          .forEach(c => walk(c, depth + 1));
      }
      spans.filter(s => !parentOf(s))
        .sort((a,b) => new Date(a.start_time) - new Date(b.start_time))
        .forEach(s => walk(s, 0));
      return result;
    }

    const spans = sortSpans(t.spans || []).map(s => `
      <div class="span-row">
        <span style="width:${(s._depth||0)*16}px;flex-shrink:0;display:inline-block"></span>
        <span class="${s.is_error ? 'span-error-dot' : 'span-ok-dot'}"></span>
        <span class="span-svc">${s.service_name || '—'}</span>
        <span class="span-op">${s.operation_name || '—'}</span>
        <span class="span-dur">${(s.duration_ms ?? 0).toFixed(1)} ms</span>
      </div>
    `).join('');

    const errCount = (t.spans || []).filter(s => s.is_error).length;
    return `
      <div class="trace-block collapsed" id="trace-${t.trace_id}"
           data-has-error="${errCount > 0}"
           data-duration="${(t.duration_ms??0).toFixed(1)}">
        <div class="trace-header" onclick="toggleTrace('${t.trace_id}')">
          <span class="trace-id">${(t.trace_id || '').slice(0, 16)}…</span>
          <span class="trace-svc">${t.root_service || '—'}</span>
          ${errCount ? `<span class="severity-badge error">${errCount} error(s)</span>` : ''}
          <span class="trace-dur">${(t.duration_ms ?? 0).toFixed(1)} ms</span>
          <span class="trace-chevron">▾</span>
        </div>
        <div class="trace-spans">${spans}</div>
      </div>
    `;
  }

  function renderTracePage() {
    const { errorsOnly, minDuration } = _traceFilters;
    const filtered = _allTraceData.filter(t => {
      const hasError = (t.spans || []).some(s => s.is_error);
      const dur = t.duration_ms ?? 0;
      return (!errorsOnly || hasError) && (dur >= minDuration);
    });

    const totalPages = Math.max(1, Math.ceil(filtered.length / TRACE_PAGE_SIZE));
    _tracePage = Math.min(_tracePage, totalPages - 1);
    const pageData = filtered.slice(_tracePage * TRACE_PAGE_SIZE, (_tracePage + 1) * TRACE_PAGE_SIZE);

    const container = document.getElementById('trace-rows-container');
    if (container) {
      container.innerHTML = pageData.length
        ? pageData.map(buildTraceBlock).join('')
        : '<div style="padding:16px;color:var(--text-muted);font-size:12px">No traces match the current filters.</div>';
    }


    const traceHeaderCount = document.getElementById('trace-header-count');
    if (traceHeaderCount) traceHeaderCount.textContent = `${filtered.length} of ${_allTraceData.length} trace(s) ▾`;

    const tracePageInput = document.getElementById('trace-page-input');
    if (tracePageInput) tracePageInput.value = _tracePage + 1;
    const tracePageTotal = document.getElementById('trace-page-total');
    if (tracePageTotal) tracePageTotal.textContent = `of ${totalPages}`;

    const prevBtn = document.getElementById('trace-prev-btn');
    const nextBtn = document.getElementById('trace-next-btn');
    if (prevBtn) prevBtn.disabled = _tracePage === 0;
    if (nextBtn) nextBtn.disabled = _tracePage >= totalPages - 1;

    const errBtn = document.getElementById('filter-errors-btn');
    if (errBtn) errBtn.classList.toggle('active', errorsOnly);
  }

  function applyTraceFilters() { _tracePage = 0; renderTracePage(); }

  function toggleErrorFilter() {
    _traceFilters.errorsOnly = !_traceFilters.errorsOnly;
    applyTraceFilters();
  }

  function updateDurationFilter(val) {
    _traceFilters.minDuration = parseFloat(val) || 0;
    applyTraceFilters();
  }

  function renderTraces(traces) {
    const list = traces?.traces || [];
    if (!list.length) return null;

    _allTraceData = list;
    _tracePage = 0;
    _traceFilters = { errorsOnly: false, minDuration: 0 };

    const filterBar = `
      <div class="trace-filters">
        <span class="filter-label">Filter</span>
        <button class="filter-toggle" id="filter-errors-btn" onclick="toggleErrorFilter()">
          ● Errors only
        </button>
        <span class="filter-label" style="margin-left:4px">Min duration</span>
        <input class="filter-input" type="number" placeholder="0 ms" min="0" step="0.1"
          style="width:70px" oninput="updateDurationFilter(this.value)" />
      </div>
    `;
    const tracePager = `
      <div class="pagination">
        <button class="page-btn" id="trace-prev-btn" onclick="tracePagePrev()">◀ Prev</button>
        <span class="page-info">Page</span>
        <input class="filter-input" id="trace-page-input" type="number" min="1" value="1"
          style="width:52px;text-align:center;padding:3px 6px"
          onchange="traceJumpToPage(this.value)"
          onkeydown="if(event.key==='Enter') traceJumpToPage(this.value)" />
        <span class="page-info" id="trace-page-total">of 1</span>
        <button class="page-btn" id="trace-next-btn" onclick="tracePageNext()">Next ▶</button>
      </div>
    `;

    const header = `<span class="panel-title">Traces</span><span class="panel-count" id="trace-header-count">${list.length} trace(s) ▾</span>`;
    const panel = collapsible(header, filterBar + '<div id="trace-rows-container"></div>' + tracePager);
    panel.id = 'traces-panel';
    setTimeout(() => renderTracePage(), 0);
    return panel;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Store last query params so Analyze can re-use them
  let _lastQuery = null;

  async function runQuery() {
    const target    = $('inp-target').value.trim();
    const namespace = $('inp-namespace').value.trim() || 'default';
    const lookback  = parseInt($('inp-lookback').value) || 30;
    const endpoint  = $('inp-endpoint').value.trim().replace(/\/$/, '');

    if (!target) { alert('Please enter a target service name.'); return; }

    _lastQuery = { target, namespace, lookback, endpoint };

    setStatus('loading');
    $('btn-query').disabled = true;
    $('main').innerHTML = `
      <div class="empty-state">
        <span class="glyph" style="animation: pulse 1s infinite; display:block">◎</span>
        <p>Querying ${target} · ${namespace} …</p>
      </div>
    `;

    try {
      const resp = await fetch(`${endpoint}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target, namespace, lookback_minutes: lookback, include_rca: false }),
      });

      if (!resp.ok) {
        const txt = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${txt}`);
      }

      const data = await resp.json();
      setStatus('ok');
      renderResult(data, false);

    } catch (err) {
      setStatus('error');
      $('main').innerHTML = `
        <div class="error-msg-box animate-in">
          <strong>Query failed</strong><br/>${escHtml(err.message)}
        </div>
      `;
    } finally {
      $('btn-query').disabled = false;
    }
  }

  async function runAnalyze() {
    if (!_lastQuery) return;
    const { target, namespace, lookback, endpoint } = _lastQuery;
    const btn = $('btn-analyze');
    if (btn) { btn.disabled = true; btn.textContent = '⟳ Analyzing…'; }
    setStatus('loading');

    try {
      const resp = await fetch(`${endpoint}/query`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ target, namespace, lookback_minutes: lookback, include_rca: true }),
      });

      if (!resp.ok) {
        const txt = await resp.text();
        throw new Error(`HTTP ${resp.status}: ${txt}`);
      }

      const data = await resp.json();
      setStatus('ok');
      renderResult(data, true);

    } catch (err) {
      setStatus('error');
      if (btn) { btn.disabled = false; btn.innerHTML = '⚡ Analyze with AI'; }
      alert('RCA failed: ' + err.message);
    }
  }

  function renderResult(data, showRca = true) {
    const main = $('main');
    main.innerHTML = '';

    // Build RCA section — either real RCA, a placeholder with button, or nothing
    let rcaSection = null;
    if (showRca && data.rca && data.rca.performed) {
      rcaSection = renderRCA(data.rca);
    } else {
      // Show placeholder panel with Analyze button
      const hasErrors = (data.correlations || []).some(c => c.severity === 'error' || c.severity === 'warn');
      const panel = document.createElement('div');
      panel.className = 'panel animate-in';
      panel.innerHTML = `
        <div class="panel-header">
          <span class="panel-title" style="color:var(--text-muted)">Root Cause Analysis</span>
          <span class="panel-count">not yet performed ▾</span>
        </div>
        <div class="panel-body">
          <div class="rca-placeholder">
            ${hasErrors
              ? 'Error signals detected. Run AI analysis to get root cause, recommended actions, and code references.'
              : 'No error signals detected in this time window. Run analysis anyway to confirm.'}
            <br/>
            <button class="btn-analyze" id="btn-analyze" onclick="runAnalyze()">
              ⚡ Analyze with AI
            </button>
          </div>
        </div>
      `;
      rcaSection = panel;
    }

    const sections = [
      renderMeta(data),
      rcaSection,
      renderCorrelations(data.correlations),
      renderMetrics(data.metrics),
      renderLogs(data.logs),
      renderTraces(data.traces),
    ].filter(Boolean);

    sections.forEach((el, i) => {
      el.style.animationDelay = `${i * 60}ms`;
      main.appendChild(el);
    });
  }


  function runMock() {
    const btn = $('btn-mock');
    const isActive = btn.classList.toggle('active');
    if (isActive) {
      setStatus('mock');
      renderResult(MOCK_DATA);
    } else {
      // Clear results and reset to idle state
      $('main').innerHTML = '';
      setStatus('');
    }
  }

  function tracePagePrev() { _tracePage = Math.max(0, _tracePage - 1); renderTracePage(); }
  function tracePageNext() { _tracePage++; renderTracePage(); }
  function traceJumpToPage(val) { const p = parseInt(val) - 1; if (!isNaN(p)) { _tracePage = Math.max(0, p); renderTracePage(); } }

  function toggleTrace(traceId) {
    const block = document.getElementById('trace-' + traceId);
    if (block) block.classList.toggle('collapsed');
  }
