# nginx serves only the static frontend (HTML, CSS, JS) on port 80.
# There is no reverse-proxy to the aggregator here — the browser calls the
# aggregator API directly on port 8080. If you're looking for API routing,
# see docker-compose.yml for the aggregator service and its port mapping.

server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # Serve any file that exists; fall back to index.html for SPA-style routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache JS/CSS during development so changes take effect on refresh
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
